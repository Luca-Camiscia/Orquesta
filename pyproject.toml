[project]
name = "orquesta"
version = "0.1.0"
description = "Multi-model orchestration for Claude Code: delegate to GPT (Codex CLI) and Gemini (Antigravity CLI) with guardrails enforced in code"
authors = [{ name = "Luca Camiscia" }]
keywords = ["llm", "multi-agent", "claude-code", "codex", "gemini", "orchestration", "sandbox"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "filelock>=3.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # `orquesta generate` corre la suite antes de commitear: pytest es dependencia de runtime.
    "pytest>=8",
    "httpx2",
]

[project.urls]
Repository = "https://github.com/Luca-Camiscia/orquesta"

[project.scripts]
orquesta = "orquesta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orquesta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Las fixtures importadas de otro módulo de tests aparecen como redefiniciones en los parámetros.
"tests/test_caracterizacion_revision.py" = ["F811"]
