<style>
:root {

  --hoja: #FFFFFF;

  --pauta: #C9D0DA;

  --claude: #6E46B8;
  --codex: #0E7480;
  --agy: #2C54C1;
  --ok: #2E7D3A;
  --warn: #A9650A;

  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="claro"]) {
    --papel: #121827;
    --hoja: #1A2235;
    --tinta: #E5E9F1;
    --tinta-suave: #A8B1C5;
    --pauta: #36415B;
    --pauta-suave: #252F45;
    --claude: #B39AF0;
    --codex: #4FC1CC;
    --agy: #86A5F5;
    --ok: #6CC27A;
    --warn: #E7A94A;
    --fail: #F07B70;
    --foco: #86A5F5;
    color-scheme: dark;
  }
}
:root[data-theme="oscuro"] {
    --papel: #121827;
    --hoja: #1A2235;
    --tinta: #E5E9F1;
    --tinta-suave: #A8B1C5;
    --pauta: #36415B;
    --pauta-suave: #252F45;
    --claude: #B39AF0;
    --codex: #4FC1CC;
    --agy: #86A5F5;
    --ok: #6CC27A;
    --warn: #E7A94A;
    --fail: #F07B70;
    --foco: #86A5F5;
    color-scheme: dark;
}
/* Paletas propias: después del tema para conservar la preferencia de Partitura. */
:root[data-estilo="archive"] {
  --papel: #111713;
  --hoja: #1C211D;
  --tinta: #F2E8D5;
  --tinta-suave: #C0B69F;
  --pauta: #6B5C40;
  --pauta-suave: #2B3027;
  --claude: #C4ADF3;
  --codex: #D8BC78;
  --agy: #78C5CA;
  --ok: #94CD87;
  --warn: #F2A36B;
  --fail: #F394A2;
  --foco: #D8BC78;
  --sans: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "EB Garamond", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
:root[data-estilo="deck"] {
  --papel: #080F1C;
  --hoja: #111E30;
  --tinta: #ECF4FF;
  --tinta-suave: #A6B8CC;
  --pauta: #3A5068;
  --pauta-suave: #1C2B41;
  --claude: #C9A6FF;
  --codex: #55DCEB;
  --agy: #8CAEFF;
  --ok: #86D79B;
  --warn: #FFB36C;
  --fail: #FF8894;
  --foco: #55DCEB;
  --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
:root[data-estilo="workshop"] {
  --papel: #EEECE3;
  --hoja: #FAF9F2;
  --tinta: #202521;
  --tinta-suave: #515A55;
  --pauta: #8A9087;
  --pauta-suave: #DFE2D8;
  --claude: #69408A;
  --codex: #005A75;
  --agy: #2547A2;
  --ok: #376B2B;
  --warn: #934500;
  --fail: #AF202B;
  --foco: #AF202B;
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  font: 16px/1.5 var(--sans);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* cabecera */
.cabecera {
  display: grid;
  grid-template-columns: auto 1fr auto auto auto;
  align-items: center;
  gap: 24px;
  padding: 14px 32px;
  background: var(--hoja);
  border-bottom: 1px solid var(--pauta);
}
.marca { font-weight: 700; font-size: 1.15rem; letter-spacing: .01em; }
.marca span { color: var(--tinta-suave); font-weight: 400; }
.salud-chip {
  justify-self: start;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px;
  border: 1px solid var(--pauta);
  border-radius: 999px;
  background: none;
  cursor: pointer;
  font-size: .92rem;
}
.salud-chip .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--pauta); }
.salud-chip.ok .punto { background: var(--ok); }
.salud-chip.warn .punto { background: var(--warn); }
.salud-chip.fail .punto { background: var(--fail); }
.mood-marca { position: relative; display: grid; justify-items: center; padding: 0 26px; min-width: 210px; }
.mood-marca svg { position: absolute; inset: 7px 0 auto 0; width: 100%; height: 34px; color: var(--pauta); }
.mood-palabra {
  position: relative;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.85rem;
  line-height: 48px;
  padding: 0 10px;
  background: linear-gradient(transparent 22%, var(--hoja) 22%, var(--hoja) 78%, transparent 78%);
}
.mood-nota { font-size: .8rem; color: var(--tinta-suave); margin-top: -4px; }
.interruptor { display: inline-flex; align-items: center; gap: 10px; font-size: .95rem; }

/* switch */
.switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch .riel { position: absolute; inset: 0; border-radius: 999px; background: var(--pauta); transition: background .15s; }
.switch .riel::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--hoja); transition: transform .15s;
}
.switch input:checked + .riel { background: var(--tinta); }
.switch input:checked + .riel::after { transform: translateX(18px); }
.switch input:focus-visible + .riel { outline: 2px solid var(--foco); outline-offset: 2px; }

/* pestañas */
.pestanas { display: flex; gap: 4px; padding: 0 32px; background: var(--hoja); border-bottom: 1px solid var(--pauta); overflow-x: auto; }
.pestanas button {
  border: 0; background: none; padding: 12px 14px 10px; cursor: pointer; color: var(--tinta-suave);
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.pestanas button[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--tinta); font-weight: 700; }
.pestanas .contador {
  display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px;
  background: var(--warn); color: var(--hoja); font-size: .78rem; font-weight: 700; text-align: center;
}

/* avisos */
#avisos { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
.aviso {
  display: flex; align-items: center; gap: 14px; justify-content: space-between;
  margin-top: 18px; padding: 12px 16px; border-radius: 8px;
  border: 1px solid var(--pauta); background: var(--hoja);
}
.aviso.importante { border-color: var(--tinta); border-width: 2px; }
.aviso.error { border-color: var(--fail); }
.aviso.error ul { margin: 4px 0 0; padding-left: 18px; }
.aviso p { margin: 0; }

main { max-width: 1180px; margin: 0 auto; padding: 24px 32px 64px; }
h2 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.6rem; margin: 0; }
h3 { font-size: 1.05rem; margin: 0; }
.barra { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.ayuda { color: var(--tinta-suave); font-size: .92rem; margin: 4px 0 0; max-width: 70ch; }

/* botones */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--pauta); background: var(--hoja);
}
.btn:hover { border-color: var(--tinta-suave); }
.btn.primario { background: var(--tinta); border-color: var(--tinta); color: var(--hoja); font-weight: 700; }
.btn.peligro { color: var(--fail); border-color: var(--fail); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.chico { padding: 4px 10px; font-size: .88rem; }
.enlace { border: 0; background: none; padding: 4px 6px; cursor: pointer; color: var(--tinta); text-decoration: underline; text-underline-offset: 3px; }
.enlace.peligro { color: var(--fail); }

/* agentes */
.seccion { margin-top: 26px; }
.seccion-titulo { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.25rem; padding-bottom: 8px; border-bottom: 1px solid var(--pauta); }
.seccion-titulo .cuenta { font-family: var(--sans); font-style: normal; font-size: .85rem; color: var(--tinta-suave); }
.muestra { width: 12px; height: 12px; border-radius: 3px; background: currentColor; }
.c-claude { color: var(--claude); } .c-codex { color: var(--codex); } .c-agy { color: var(--agy); }
.grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 14px; }
.tarjeta { background: var(--hoja); border: 1px solid var(--pauta); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.tarjeta.apagada { background: transparent; border-style: dashed; }
.tarjeta.apagada .rol, .tarjeta.apagada h4 { color: var(--tinta-suave); }
.tarjeta > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.tarjeta h4 { margin: 0; font-size: 1.08rem; display: flex; align-items: center; gap: 6px; }
.slug { font-family: var(--mono); font-size: .8rem; color: var(--tinta-suave); }
.rol { margin: 0; font-size: .94rem; }
.insignias { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.ins { font-size: .8rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--pauta); color: var(--tinta-suave); }
.ins.backend { border-color: currentColor; font-weight: 700; }
.ins.c-claude { color: var(--claude); } .ins.c-codex { color: var(--codex); } .ins.c-agy { color: var(--agy); }
.estado { margin: 0; font-size: .86rem; color: var(--tinta-suave); display: flex; align-items: center; gap: 7px; }
.estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pauta); }
.estado.desplegado::before { background: var(--ok); }
.estado.pendiente::before { background: var(--warn); }
.tarjeta footer { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; border-top: 1px solid var(--pauta-suave); padding-top: 8px; margin-top: auto; }
.mas { position: relative; margin-left: auto; }
.mas summary { list-style: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.mas summary::-webkit-details-marker { display: none; }
.mas[open] summary { background: var(--pauta-suave); }
.mas .menu { position: absolute; right: 0; top: 100%; z-index: 5; display: grid; min-width: 150px; padding: 6px; background: var(--hoja); border: 1px solid var(--pauta); border-radius: 8px; }
.mas .menu button { text-align: left; }
.prueba { font-size: .86rem; border-left: 3px solid var(--pauta); padding: 4px 10px; margin: 0; }
.prueba.ok { border-color: var(--ok); } .prueba.mal { border-color: var(--fail); }
.prueba pre { margin: 4px 0 0; white-space: pre-wrap; font-family: var(--mono); font-size: .8rem; max-height: 120px; overflow: auto; }
.candado { width: 15px; height: 15px; color: var(--tinta-suave); }

/* editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.editor-pestanas { display: flex; gap: 4px; margin: 6px 0 16px; }
.editor-pestanas button { border: 1px solid var(--pauta); background: var(--hoja); padding: 6px 14px; border-radius: 7px; cursor: pointer; }
.editor-pestanas button[aria-selected="true"] { background: var(--tinta); color: var(--hoja); border-color: var(--tinta); }
form.campos { display: grid; gap: 16px; background: var(--hoja); border: 1px solid var(--pauta); border-radius: 10px; padding: 20px; }
.campo { display: grid; gap: 5px; }
.campo > label, .campo > span.etiqueta, fieldset legend { font-weight: 700; font-size: .94rem; }
.campo small { color: var(--tinta-suave); font-size: .84rem; }
.fila { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
input[type=text], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--pauta); border-radius: 7px; background: var(--papel);
}
textarea { resize: vertical; min-height: 70px; }
textarea.prompt { min-height: 260px; line-height: 1.45; }
textarea.codigo, textarea.crudo { font-family: var(--mono); font-size: .86rem; }
textarea.crudo { min-height: 520px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
.opciones { display: flex; gap: 8px 18px; flex-wrap: wrap; }
#nc-modo .opciones { flex-direction: column; }
.opciones label { display: inline-flex; gap: 6px; align-items: center; }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; max-height: 210px; overflow: auto; padding: 8px; border: 1px solid var(--pauta-suave); border-radius: 7px; }
.tools label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
.casos { display: grid; gap: 6px; }
.caso { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.vista { position: sticky; top: 16px; display: grid; gap: 10px; }
.vista pre, pre.bloque {
  margin: 0; padding: 16px; border-radius: 10px; border: 1px solid var(--pauta); background: var(--hoja);
  font-family: var(--mono); font-size: .8rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  max-height: 70vh; overflow: auto;
}
.errores { margin: 0; padding: 10px 14px 10px 30px; border: 1px solid var(--fail); border-radius: 8px; color: var(--fail); font-size: .92rem; }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* moods */
.moods-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.mood { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--pauta); }
.mood-cab { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mood-cab strong { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.3rem; }
.etiqueta-default { font-size: .8rem; color: var(--hoja); background: var(--tinta); border-radius: 999px; padding: 1px 9px; }
.panel { background: var(--hoja); border: 1px solid var(--pauta); border-radius: 10px; padding: 18px 20px; }

/* aplicar */
.diff { margin: 0; border: 1px solid var(--pauta); border-radius: 10px; background: var(--hoja); font-family: var(--mono); font-size: .8rem; line-height: 1.5; overflow: auto; max-height: 62vh; }
.diff div { padding: 0 14px; white-space: pre-wrap; word-break: break-word; }
.diff .add { background: color-mix(in srgb, var(--ok) 13%, transparent); }
.diff .del { background: color-mix(in srgb, var(--fail) 13%, transparent); }
.diff .hunk { color: var(--tinta-suave); }
.diff .archivo { font-weight: 500; background: var(--pauta-suave); padding-top: 4px; padding-bottom: 4px; }
.resumen { margin: 10px 0; padding-left: 20px; }
.violacion { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 2px solid var(--fail); border-radius: 8px; margin: 8px 0; }

/* salud */
.tabla-uso { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tabla-uso th, .tabla-uso td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--pauta); }
/* RR. HH. comparte los tokens de los cuatro estilos. */
.rrhh-bloque { margin-bottom: 22px; }
.rrhh-tabla { overflow-x: auto; }
.rrhh-escala { display: flex; align-items: center; gap: 8px; margin: 14px 0; }
.rrhh-escala span { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--pauta); border-radius: 6px; }
.rrhh-escala .activo { background: var(--ok); color: var(--hoja); }
.rrhh-escala.media .activo { background: var(--warn); }
.rrhh-escala.alta .activo { background: var(--fail); }
.rrhh-senal { display: inline-block; margin: 2px; border: 1px solid var(--warn); border-radius: 5px; padding: 1px 6px; font-size: .8rem; }
.rrhh-senal.falla { border-color: var(--fail); }
.rrhh-sugerencia { padding: 8px 0; font-size: .88rem; color: var(--tinta-suave); }
.rrhh-sugerencia p { margin: 4px 0; }
.rrhh-opinion { white-space: pre-wrap; overflow-wrap: anywhere; }
.chequeos { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--pauta); }
.chequeo { display: grid; grid-template-columns: 18px 1fr auto; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--pauta); align-items: start; }
.chequeo .luz { width: 12px; height: 12px; border-radius: 50%; margin-top: 6px; }
.luz.ok { background: var(--ok); } .luz.warn { background: var(--warn); } .luz.fail { background: var(--fail); }
.chequeo p { margin: 0; }
.chequeo .sug { color: var(--tinta-suave); font-size: .9rem; }
.chequeo .nombre { font-weight: 700; }
.semaforo { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; }
.semaforo .luz { width: 16px; height: 16px; border-radius: 50%; }
code.cmd { display: block; padding: 12px 14px; border-radius: 8px; background: var(--papel); border: 1px solid var(--pauta); font-family: var(--mono); font-size: .84rem; white-space: pre-wrap; word-break: break-all; }

/* historial */
.historia { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.commits { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--pauta); }
.commits li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 2px; border-bottom: 1px solid var(--pauta); }
.commits .meta { color: var(--tinta-suave); font-size: .84rem; }
.changelog h3 { margin: 16px 0 6px; font-size: .98rem; }
.changelog ul { margin: 0; padding-left: 18px; }

/* plugins */
.plugin { padding: 14px 0; border-bottom: 1px solid var(--pauta); }
.plugin h3 .ayuda { font-weight: 400; }
.plugin table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .9rem; }
.plugin th, .plugin td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--pauta-suave); vertical-align: top; }

/* conversaciones */
.chat { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
.lateral { display: grid; gap: 14px; position: sticky; top: 16px; }
.lista-conv { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 55vh; overflow: auto; }
.lista-conv button { width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.lista-conv button[aria-current="true"] { background: var(--hoja); outline: 1px solid var(--pauta); }
.badge { display: inline-block; font-size: .72rem; padding: 0 7px; border-radius: 999px; margin-left: 6px; border: 1px solid currentColor; vertical-align: 1px; }

<body>
<header class="cabecera">
  <div class="marca">orquesta <span>local</span></div>
  <button class="salud-chip" id="salud-chip" type="button"><span class="punto"></span><span id="salud-texto">Revisando salud…</span></button>
  <div class="mood-marca" title="Mood por defecto del orquestador">
    <svg viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1"><line x1="0" y1="1" x2="200" y2="1"/><line x1="0" y1="9" x2="200" y2="9"/><line x1="0" y1="17" x2="200" y2="17"/><line x1="0" y1="25" x2="200" y2="25"/><line x1="0" y1="33" x2="200" y2="33"/></g>
    </svg>
    <span class="mood-palabra" id="mood-actual">…</span>
    <span class="mood-nota">mood por defecto</span>
  </div>
  <div class="estilo-controles">
    <button class="enlace" id="tema" type="button" title="Tema">Tema: auto</button>
    <label class="sr" for="estilo">Estilo</label>
    <select id="estilo">
      <option value="partitura">Partitura</option>
      <option value="archive">The Archive</option>
      <option value="deck">Command Deck</option>
      <option value="workshop">The Workshop</option>
    </select>
  </div>
  <label class="interruptor"><span class="switch"><input type="checkbox" id="orq-toggle"><span class="riel"></span></span><span>Orquestación</span></label>
</header>
<nav class="pestanas" role="tablist" id="pestanas"></nav>
<div id="avisos" aria-live="polite"></div>
<main id="panel"><p class="cargando">Cargando…</p></main>
<dialog id="paleta" aria-label="Paleta de comandos"><input type="text" id="paleta-q" placeholder="Buscá un comando, una conversación o un texto…" autocomplete="off"><ul id="paleta-lista" class="lista-conv"></ul><p class="ayuda">Ctrl+K abre esto. Enter elige, Esc cierra. En el chat: @ para mencionar, Ctrl+Enter envía, Esc detiene.</p></dialog>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const TOKEN = $('meta[name="orquesta-token"]').content;
const NOMBRE_BACKEND = {claude: "Claude", codex: "Codex", agy: "Antigravity"};
const ORDEN_BACKEND = ["claude", "codex", "agy"];
const PESTANAS = [["chat", "Conversaciones"], ["tareas", "Tareas"], ["agentes", "Agentes"], ["rrhh", "RR. HH."], ["moods", "Moods"], ["aplicar", "Aplicar"], ["salud", "Salud"], ["historial", "Historial"], ["plugins", "Plugins"]];
const CANDADO = '<svg class="candado" viewBox="0 0 16 16" aria-label="protegido" role="img"><path fill="currentColor" d="M5 7V5a3 3 0 0 1 6 0v2h.5A1.5 1.5 0 0 1 13 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 13.5v-5A1.5 1.5 0 0 1 4.5 7H5Zm1.5 0h3V5a1.5 1.5 0 0 0-3 0v2Z"/></svg>';

const st = {chat: {projects: [], pid: null, convs: [], conv: null, nueva: false, participantes: []}, data: null, tab: "chat", ed: null, salud: null, saludCargando: false, dry: null, confirmados: new Set(),
            historia: null, changelog: "", plugins: null, modelos: {}, aviso: null, pruebas: {}, mensaje: "Aplicar cambios desde la UI",
            rrhh: {evaluacion: null, catalogo: null, cargando: false, error: null, texto: "", triage: null, evaluando: false, asc: false,
                   revision: 0, triageError: null, opinion: null, consultando: false, consultas: []}};

class ApiError extends Error {
  constructor(status, data) {
    super((data && (data.detail || (data.errors || []).join("; "))) || `Error ${status}`);
    this.status = status; this.data = data || {};
  }
}
async function api(method, path, body) {
  const res = await fetch(path, {method, headers: {"Content-Type": "application/json", "X-Orquesta-Token": TOKEN},
                                 body: body === undefined ? undefined : JSON.stringify(body)});
  let data = null;
  try { data = await res.json(); } catch { data = null; }
  if (!res.ok) throw new ApiError(res.status, data);
  return data;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("visible");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("visible"), 3600);
}
function dialogo({titulo, texto = "", aceptar = "Aceptar", cancelar = "Cancelar", input = null, peligro = false, html = ""}) {
  const dlg = $("#dlg");
  $("#dlg-form").innerHTML = `<h3>${esc(titulo)}</h3>${texto ? `<p>${esc(texto)}</p>` : ""}${html}
    ${input !== null ? `<input type="text" id="dlg-input" autocomplete="off" value="${esc(input)}" aria-label="${esc(titulo)}">` : ""}
    <div class="acciones">${cancelar ? `<button class="btn" value="cancel">${esc(cancelar)}</button>` : ""}
    <button class="btn ${peligro ? "peligro" : "primario"}" value="ok" id="dlg-ok">${esc(aceptar)}</button></div>`;
  return new Promise((resolve) => {
    dlg.onclose = () => resolve(dlg.returnValue === "ok" ? (input !== null ? $("#dlg-input").value : true) : null);
    dlg.showModal();
    (input !== null ? $("#dlg-input") : $("#dlg-ok")).focus();
  });
}
function mostrarError(e, destino) {
  const errores = e.data && e.data.errors ? e.data.errors : [e.message];
  const html = `<ul class="errores">${errores.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` +
    (e.status === 409 && !e.data.needs_confirmation ? `<p><button class="btn chico" data-action="recargar">Recargar</button></p>` : "");
  if (destino) destino.innerHTML = html; else toast(errores[0]);
}
async function conConfirmacion(nombre, fn) {
  try { return await fn(undefined); }
  catch (e) {
    if (!(e instanceof ApiError && e.status === 409 && e.data.needs_confirmation)) throw e;
    const seguir = await dialogo({titulo: `${nombre} está protegido`, texto: "Cambiar un agente protegido requiere tu confirmación explícita. ¿Querés seguir?", aceptar: "Seguir"});
    if (!seguir) return null;
    const escrito = await dialogo({titulo: "Confirmá con el nombre", texto: `Escribí ${nombre} para confirmar el cambio.`, aceptar: "Confirmar", input: ""});
    if (escrito !== nombre) { toast("El nombre no coincide: no se guardó nada."); return null; }
    return await fn(nombre);
  }
}
const hash = () => st.data.yaml_hash;

async function cargar() {
  try { st.data = await api("GET", "/api/state"); }
  catch (e) { $("#panel").innerHTML = `<div class="aviso error"><p>No pude leer el estado: ${esc(e.message)}</p></div>`; return; }
  if (st.ed && !st.ed.nuevo && !st.data.agents.some((a) => a.name === st.ed.agent.name)) st.ed = null;
  render();
}
async function cargarSalud(refrescar = false) {
  st.saludCargando = true; renderCabecera(); if (st.tab === "salud") renderPanel();
  try { st.salud = await api(refrescar ? "POST" : "GET", refrescar ? "/api/health/refresh" : "/api/health"); }
  catch (e) { toast(`No pude correr doctor: ${e.message}`); }
  st.saludCargando = false; renderCabecera(); if (st.tab === "salud") renderPanel();
}

function render() { renderCabecera(); renderPestanas(); renderAvisos(); renderPanel(); }
function renderCabecera() {
  const o = st.data.orchestrator || {};
  $("#mood-actual").textContent = o.default_mood || "—";
  $("#orq-toggle").checked = !!o.enabled;
  const chip = $("#salud-chip");
  chip.className = "salud-chip " + (st.salud ? st.salud.overall : "");
  if (st.saludCargando && !st.salud) { $("#salud-texto").textContent = "Revisando salud…"; return; }
  if (!st.salud) { $("#salud-texto").textContent = "Salud sin datos"; return; }
  const n = {ok: 0, warn: 0, fail: 0};
  st.salud.checks.forEach((c) => n[c.status]++);
  $("#salud-texto").textContent = `${n.ok} bien, ${n.warn} avisos, ${n.fail} fallas`;
}
function renderPestanas() {
  const pend = st.data.pending.changes;
  $("#pestanas").innerHTML = PESTANAS.map(([id, nombre]) =>
    `<button role="tab" aria-selected="${st.tab === id}" data-tab="${id}">${nombre}${id === "aplicar" && pend ? `<span class="contador" aria-label="${pend} cambios">${pend}</span>` : ""}</button>`).join("");
}
function renderAvisos() {
  const partes = [];
  if (st.aviso) partes.push(`<div class="aviso importante"><p>${esc(st.aviso)}</p><button class="enlace" data-action="cerrar-aviso">Cerrar</button></div>`);
  if (st.data.errors.length) partes.push(`<div class="aviso error"><div><p><strong>orquesta.yaml tiene errores</strong>; no se puede aplicar hasta corregirlos:</p><ul>${st.data.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div></div>`);

async function cargarRRHH() {
  const r = st.rrhh;
  if (r.cargando) return;
  r.cargando = true; r.error = null;
  try {
    const [ev, cat] = await Promise.all([api("GET", "/api/rrhh/evaluacion"), api("GET", "/api/rrhh/catalogo")]);
    r.evaluacion = ev.agentes; r.catalogo = cat;
  } catch (e) { r.error = e.message; }
  finally { r.cargando = false; if (st.tab === "rrhh") renderPanel(); }
}
function recomendadoRRHH(a, revisor = false) {
  const desplegado = st.data.agents.some((x) => x.name === a.name && x.deployed && x.enabled);
  return `<article class="tarjeta"><header><h4 class="c-${esc(a.backend)}">${revisor ? "Revisor: " : ""}${esc(a.display_name)}</h4></header>
    <p>${esc(a.modelo || "default del CLI")}${a.esfuerzo ? ` · esfuerzo ${esc(a.esfuerzo)}` : ""} · puntaje ${esc(a.puntaje)}</p>
    <ul>${a.motivos.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
    <footer><button class="btn chico" data-action="rrhh-conversar" data-name="${esc(a.name)}" ${desplegado ? "" : 'disabled title="Aplicá el agente antes de abrir una conversación"'}>Abrir conversación con este agente</button></footer></article>`;
}
function actualizarTextoRRHH(texto) {
  const r = st.rrhh;
  if (r.texto === texto) return;
  r.texto = texto; r.revision++; r.triage = null; r.triageError = null; r.opinion = null;
  const resultados = $("#rrhh-resultados"); if (resultados) resultados.innerHTML = "";
  const boton = $('[data-action="rrhh-reclutador"]'); if (boton) boton.disabled = r.consultando || !texto.trim();
}
async function evaluarTareaRRHH() {
  const r = st.rrhh, texto = r.texto.trim(), revision = r.revision;
  if (!texto || r.evaluando) return;
  r.evaluando = true; r.triageError = null; renderPanel();
  try {
    const base = await api("POST", "/api/rrhh/triage", {texto});
    if (revision === r.revision) r.triage = base;
  } catch (e) { if (revision === r.revision) r.triageError = e.message; }
  finally { r.evaluando = false; if (st.tab === "rrhh") renderPanel(); }
}
async function pedirOpinionRRHH() {
  const r = st.rrhh, texto = r.texto.trim(), revision = r.revision;
  if (!texto || r.consultando) return;
  // Guardar el texto de cada consulta, incluso cuando su respuesta llega obsoleta.
  const consulta = {texto, estado: "CARGANDO", latencia_s: null, opinion: null, error: null};
  r.consultas.push(consulta); r.consultando = true; r.opinion = null; renderPanel();
  try {
    const data = await api("POST", "/api/rrhh/reclutador", {texto});
    Object.assign(consulta, data);
    if (revision === r.revision) { r.triage = data.base; r.opinion = consulta; }
  } catch (e) {
    Object.assign(consulta, {estado: "ERROR", error: e.message});
    if (revision === r.revision) r.opinion = consulta;
  } finally { r.consultando = false; if (st.tab === "rrhh") renderPanel(); }
}

async function cargarCrudo() {
  try { const r = await api("GET", `/api/agents/${encodeURIComponent(st.ed.agent.name)}/raw`); st.ed.crudo = r.content; }
  catch (e) { st.ed.crudo = ""; toast(e.message); }
  if (st.ed && st.ed.vista === "raw") $("#crudo").value = st.ed.crudo;
}
function leerFormulario() {
  const f = $("#form-agente"), a = {...st.ed.agent};
  a.name = f.name.value.trim();
  a.display_name = f.display_name.value.trim() || null;
  a.enabled = f.enabled.checked;
  a.backend = f.backend.value;
  a.wrapper_model = f.wrapper_model.value || null;
  a.backend_model = f.backend_model.value.trim() || null;
  a.backend_effort = a.backend === "codex" ? (f.backend_effort.value || null) : null;
  a.role = f.role.value.trim();
  a.route_when = $$("[data-caso]", f).map((i) => i.value.trim()).filter(Boolean);
  a.avoid_when = $$("[data-evitar]", f).map((i) => i.value.trim()).filter(Boolean);
  a.description = f.description.value.trim();
  a.mode = f.querySelector('input[name="mode"]:checked').value;
  a.isolation = a.mode === "write" ? f.querySelector('input[name="isolation"]:checked').value : null;
  const extra = f.tools_extra.value.split(",").map((t) => t.trim()).filter(Boolean);
  const elegidas = [...$$('input[name="tool"]:checked', f).map((i) => i.value), ...extra];
  const previas = (st.ed.agent.tools || []).filter((t) => elegidas.includes(t));
  a.tools = [...new Set([...previas, ...elegidas])];  // respeta el orden que ya tenían
  a.plugins = $$('input[name="plugin"]:checked', f).map((i) => i.value);
  a.protected = f.protected.checked;
  a.prompt = f.prompt.value;
  const raw = f.extra.value.trim();
  try { a.extra_frontmatter = raw ? JSON.parse(raw) : {}; }
  catch { throw new ApiError(422, {errors: ["El frontmatter extra no es JSON válido."]}); }
  return a;
}
function programarPreview(ms = 280) { clearTimeout(programarPreview.t); programarPreview.t = setTimeout(previewAgente, ms); }

}
async function guardarAgente() {

function lineasDiff(diff) {
  return diff.split("\n").map((l) => {
    let c = "";
    if (l.startsWith("+++") || l.startsWith("---") || l.startsWith("~ ")) c = "archivo";
    else if (l.startsWith("+")) c = "add"; else if (l.startsWith("-")) c = "del"; else if (l.startsWith("@@")) c = "hunk";
    return `<div class="${c}">${esc(l) || " "}</div>`;
  }).join("");
}
function panelAplicar() {
  const d = st.dry;

    <button class="btn" data-action="dry-run">${d ? "Volver a revisar" : "Revisar cambios"}</button></div>`;

  const viol = d.violations.map((v) => `<label class="violacion"><input type="checkbox" data-confirmar="${esc(v.agent)}" ${st.confirmados.has(v.agent) ? "checked" : ""}>

async function correrDryRun() {

    st.confirmados.forEach((a) => { if (!pendientes.has(a)) st.confirmados.delete(a); });

/* ---------- markdown seguro: se escapa TODO primero y recién después se da formato ---------- */
function mdInline(s) {
  return s
    .replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\[([^\]\n]+)\]\((file:\/\/[^\s)]+)\)/g, '<span class="ruta" title="$2">$1</span>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,:;!?]|$)/g, "$1<em>$2</em>");
}
function md(src) {
  const bloques = [];
  const s = esc(src).replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => { bloques.push(code.replace(/\n$/, "")); return `\u0000${bloques.length - 1}\u0000`; });
  const out = []; let parrafo = []; let lista = null;
  const cerrarP = () => { if (parrafo.length) { out.push(`<p>${parrafo.map(mdInline).join("<br>")}</p>`); parrafo = []; } };
  const cerrarL = () => { if (lista) { out.push(`<${lista.tag}>${lista.items.map((i) => `<li>${mdInline(i)}</li>`).join("")}</${lista.tag}>`); lista = null; } };
  for (const linea of s.split("\n")) {
    let m;
    if ((m = linea.match(/^\u0000(\d+)\u0000$/))) { cerrarP(); cerrarL(); out.push(`<pre><code>${bloques[+m[1]]}</code></pre>`); }
    else if ((m = linea.match(/^(#{1,4})\s+(.*)$/))) { cerrarP(); cerrarL(); out.push(`<p class="t${m[1].length}">${mdInline(m[2])}</p>`); }
    else if (/^\s*([-*_])\1{2,}\s*$/.test(linea)) { cerrarP(); cerrarL(); out.push("<hr>"); }
    else if ((m = linea.match(/^\s*[-*]\s+(.*)$/)) || (m = linea.match(/^\s*\d+[.)]\s+(.*)$/))) {
      const tag = /^\s*\d/.test(linea) ? "ol" : "ul";
      cerrarP(); if (lista && lista.tag !== tag) cerrarL(); if (!lista) lista = {tag, items: []}; lista.items.push(m[1]);
    }
    else if (!linea.trim()) { cerrarP(); cerrarL(); }
    else if (lista && /^\s{2,}\S/.test(linea)) { lista.items[lista.items.length - 1] += " " + linea.trim(); }
    else { cerrarL(); parrafo.push(linea); }
  }
  cerrarP(); cerrarL();
  return out.join("");
}

function ordenarEnColumnas(v, html) {
  // Reordena: en cada tramo entre mensajes del usuario, una celda por participante en orden fijo.
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  const out = []; let tramo = [];
  const volcar = () => {
    const porAutor = {};
    tramo.forEach((el) => { const a = el.dataset.autor; if (el.classList.contains("veredicto")) return; (porAutor[a] = porAutor[a] || []).push(el); });
    const filas = Math.max(0, ...Object.values(porAutor).map((x) => x.length));
    for (let i = 0; i < filas; i++) v.participants.forEach((p) => { const el = (porAutor[p] || [])[i]; out.push(el ? el.outerHTML : "<div></div>"); });
    tramo.filter((el) => el.classList.contains("veredicto")).forEach((el) => out.push(el.outerHTML));
    tramo = [];
  };
  [...tmp.children].forEach((el) => { if (el.classList.contains("usuario")) { volcar(); out.push(el.outerHTML); } else tramo.push(el); });
  volcar();
  return out.join("");
}

        const contenido = $("#crudo").value;
        const r = await conConfirmacion(st.ed.agent.name, (confirm) => api("POST", `/api/agents/${encodeURIComponent(st.ed.agent.name)}/raw`, {content: contenido, expected_hash: hash(), confirm}));
        if (r) { await dialogo({titulo: "El agente ahora es manual", texto: r.warning, aceptar: "Entendido", cancelar: null}); st.ed = null; await cargar(); } break;
      }
      case "desmanual": {
        const r = await conConfirmacion(st.ed.agent.name, (confirm) => api("POST", `/api/agents/${encodeURIComponent(st.ed.agent.name)}/unmanual`, {expected_hash: hash(), confirm}));
        if (r) { toast(r.warning); st.ed = null; await cargar(); } break;
      }
      case "mood-guardar": await moodAccion({action: "update", name: n, description: $(`[data-mood-desc="${CSS.escape(n)}"]`).value}, `Guardado ${n}.`); break;
      case "mood-default": await moodAccion({action: "default", name: n}, `${n} es el nuevo default.`); break;
      case "mood-borrar": { const ok = await dialogo({titulo: `Borrar el mood ${n}`, aceptar: "Borrar", peligro: true}); if (ok) await moodAccion({action: "delete", name: n}, `Borrado ${n}.`); break; }
      case "mood-renombrar": { const nuevo = await dialogo({titulo: `Renombrar ${n}`, input: n, aceptar: "Renombrar"}); if (nuevo && nuevo !== n) await moodAccion({action: "rename", name: n, new_name: nuevo.trim()}, `Renombrado a ${nuevo}.`); break; }
      case "pl-desinstalar": {
        const escrito = await dialogo({titulo: `Desinstalar ${n}`, texto: `Toca la config global de Claude Code. Escribí ${n} para confirmar.`, input: "", aceptar: "Desinstalar", peligro: true});
        if (escrito === null) break;
        if (escrito !== n) { toast("No coincide: no se desinstaló nada."); break; }
        const r = await api("POST", "/api/plugins/uninstall", {id: n, confirm: n});
        st.aviso = `Desinstalado ${n}. ${r.note}`; st.plugins = null; await cargar(); break;
      }
      case "chat-abrir": await abrirConv(n); break;
      case "msg-copiar": { const m = st.chat.conv.messages.find((x) => x.id === n); await navigator.clipboard.writeText(m.text); toast("Copiado."); break; }
      case "msg-reintentar": {
        const m = st.chat.conv.messages.find((x) => x.id === n);
        await api("POST", `/api/chat/conversations/${st.chat.conv.id}/messages`, {text: m.text}); await abrirConv(st.chat.conv.id); break;
      }
      case "mencion": {
        const ta = $("#chat-texto"); const pos = ta.selectionStart; const antes = ta.value.slice(0, pos).replace(/@[a-z0-9-]*$/, "");
        ta.value = `${antes}@${n} ${ta.value.slice(pos)}`; $("#menciones").innerHTML = ""; ta.focus(); break;
      }
      case "t-recargar": st.tareas = null; renderPanel(); break;
      case "t-merge": {
        if (!await dialogo({titulo: "Mergear la tarea", texto: `Se mergea ${n} en su repo y se borra el worktree. Si no pasó por la review del chat, revisá el diff antes.`, aceptar: "Mergear"})) break;
        await api("POST", "/api/worktrees/merge", {branch: n, confirm: true}); toast("Mergeado."); st.tareas = null; renderPanel(); break;
      }
      case "t-descartar": {
        if (!await dialogo({titulo: "Descartar la tarea", texto: `Se borran el worktree y la rama ${n}, aunque no esté mergeada.`, aceptar: "Descartar", peligro: true})) break;
        await api("POST", "/api/worktrees/discard", {branch: n, confirm: true}); toast("Descartado."); st.tareas = null; renderPanel(); break;
      }
      case "chat-columnas": st.chat.columnas = !st.chat.columnas; renderPanel(); break;
      case "chat-detener": await api("POST", `/api/chat/conversations/${st.chat.conv.id}/cancel`); toast("Cortando el turno…"); break;
      case "chat-nueva": st.chat.agenteInicial = null; st.chat.tituloInicial = ""; st.chat.nueva = true; renderPanel(); break;
      case "chat-cancelar": st.chat.nueva = false; renderPanel(); break;
      case "chat-proyecto": {
        const nombre = await dialogo({titulo: "Nuevo proyecto", texto: "Nombre del proyecto:", input: "", aceptar: "Seguir"});
        if (!nombre) break;
        const dir = await dialogo({titulo: "Directorio del proyecto", texto: "Ruta absoluta del directorio de trabajo (idealmente un repo git):", input: "", aceptar: "Crear proyecto"});
        if (!dir) break;
        const pr = await api("POST", "/api/chat/projects", {name: nombre, dir});
        st.chat.pid = pr.id; st.chat.conv = null; st.chat.nueva = true; await cargarChat(); break;
      }
      case "chat-borrar": {
        if (!await dialogo({titulo: "Borrar conversación", texto: "Se borra el historial. Los worktrees abiertos quedan (los ves con orquesta wt list).", aceptar: "Borrar", peligro: true})) break;
        await api("DELETE", `/api/chat/conversations/${st.chat.conv.id}`); st.chat.conv = null; await cargarChat(); break;
      }
      case "chat-quitar": {
        const v = st.chat.conv;
        st.chat.conv = await api("POST", `/api/chat/conversations/${v.id}/participants`, {participants: v.participants.filter((p) => p !== n)}); renderPanel(); break;
      }
      case "chat-merge": {
        if (!await dialogo({titulo: "Mergear los cambios", texto: `Se mergea ${n} en tu proyecto y se borra el worktree.`, aceptar: "Mergear"})) break;
        try { await api("POST", `/api/chat/conversations/${st.chat.conv.id}/worktrees/merge`, {branch: n}); }
        catch (e) {
          if (!(e.status === 409 && e.data.needs_confirmation)) throw e;
          if (!await dialogo({titulo: "Todavía no está listo para mergear", texto: e.data.detail, aceptar: "Mergear igual", peligro: true})) break;
          await api("POST", `/api/chat/conversations/${st.chat.conv.id}/worktrees/merge`, {branch: n, force: true});
        }
        toast("Mergeado."); await abrirConv(st.chat.conv.id); break;
      }
      case "chat-descartar": {
        if (!await dialogo({titulo: "Descartar los cambios", texto: `Se borran el worktree y la rama ${n}.`, aceptar: "Descartar", peligro: true})) break;
        await api("POST", `/api/chat/conversations/${st.chat.conv.id}/worktrees/discard`, {branch: n}); toast("Descartado."); await abrirConv(st.chat.conv.id); break;
      }
      case "dry-run": await correrDryRun(); break;
      case "aplicar": await aplicar(); break;
      case "descartar": {
        const ok = await dialogo({titulo: "Descartar los cambios sin aplicar", texto: "orquesta.yaml vuelve a la última versión commiteada. Lo que editaste y no aplicaste se pierde.", aceptar: "Descartar", peligro: true});
        if (ok) { await api("POST", "/api/discard", {confirm: true}); st.dry = null; toast("Cambios descartados."); await cargar(); } break;
      }
      case "rechequear": st.uso = null; await cargarSalud(true); break;
      case "llamar": await llamarThatItGuy(n, t.dataset.msg); break;
      case "restaurar": {
        const ok = await dialogo({titulo: "Restaurar esta versión", texto: `orquesta.yaml vuelve a como estaba en «${t.dataset.msg}». Queda como cambio sin aplicar: después revisás el diff y aplicás.`, aceptar: "Restaurar"});
        if (!ok) break;
        st.dry = await api("POST", `/api/history/${t.dataset.sha}/restore`, {expected_hash: hash()});
        st.mensaje = `Rollback a ${t.dataset.sha.slice(0, 7)}: ${t.dataset.msg}`; st.tab = "aplicar"; await cargar(); break;
      }
    }
  } catch (e) { mostrarError(e, null); }
});
document.addEventListener("change", async (ev) => {
  const t = ev.target;
  try {
    if (t.dataset.action === "toggle") {
      const a = sinCalculados(st.data.agents.find((x) => x.name === t.dataset.name));
      a.enabled = t.checked;
      const r = await conConfirmacion(a.name, (confirm) => api("PUT", `/api/agents/${encodeURIComponent(a.name)}`, {agent: a, expected_hash: hash(), confirm}));
      if (r) toast(`${a.name} ${a.enabled ? "habilitado" : "deshabilitado"}. Aplicá para que tome efecto.`);
      await cargar();
    } else if (t.id === "orq-toggle") {
      await api("PUT", "/api/orchestrator", {enabled: t.checked, expected_hash: hash()});
      toast(t.checked ? "Orquestación activada. Aplicá para que tome efecto." : "Orquestación desactivada. Aplicá para que tome efecto.");
      await cargar();
    } else if (t.id === "m-default") {
      await moodAccion({action: "default", name: t.value}, `${t.value} es el nuevo default.`);
    } else if (t.id === "m-tag") {
      await api("PUT", "/api/orchestrator", {show_mood_tag: t.checked, expected_hash: hash()}); await cargar();
    } else if (t.id === "chat-proy") {
      st.chat.pid = t.value; st.chat.conv = null; st.chat.nueva = false; await cargarChat();
    } else if (t.name === "nc-kind") {
      $("#nc-modo").disabled = t.value !== "reunion";
    } else if (t.id === "chat-sumar" && t.value) {
      const v = st.chat.conv;
      st.chat.conv = await api("POST", `/api/chat/conversations/${v.id}/participants`, {participants: [...v.participants, t.value]}); renderPanel();
    } else if (t.dataset.confirmar) {
      if (t.checked) st.confirmados.add(t.dataset.confirmar); else st.confirmados.delete(t.dataset.confirmar);
      renderPanel();
    }
  } catch (e) { mostrarError(e, null); await cargar(); }
});
document.addEventListener("submit", async (ev) => {
  if (ev.target.id === "rrhh-triage") {
    ev.preventDefault();
    actualizarTextoRRHH($("#rrhh-texto").value);
    await evaluarTareaRRHH();
    return;
  }
  if (ev.target.id === "chat-form") {
    ev.preventDefault();
    const kind = $('input[name="nc-kind"]:checked').value;
    const participants = $$('input[name="nc-p"]:checked').map((i) => i.value);
    try {
      const pid = st.chat.pid === "sin-proyecto" ? null : st.chat.pid;
      const v = await api("POST", "/api/chat/conversations", {project_id: pid, title: $("#nc-titulo").value, kind, mode: $('input[name="nc-mode"]:checked').value, participants});
      await cargarChat(); await abrirConv(v.id);
    } catch (e) { mostrarError(e, $("#nc-err")); }
    return;
  }
  if (ev.target.id === "chat-enviar") {
    ev.preventDefault();
    const texto = $("#chat-texto").value.trim();
    if (!texto) return;
    try {
      if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
      await api("POST", `/api/chat/conversations/${st.chat.conv.id}/messages`, {text: texto}); await abrirConv(st.chat.conv.id);
    }
    catch (e) { mostrarError(e, null); }
    return;
  }
  if (ev.target.id === "pl-nuevo") {
    ev.preventDefault();
    const repo = $("#pl-repo").value.trim(), id = $("#pl-id").value.trim();
    const escrito = await dialogo({titulo: `Instalar ${id}`, texto: `Se instala globalmente en Claude Code, solo si hay auditoría ok del commit actual de ${repo}. Escribí ${id} para confirmar.`, input: "", aceptar: "Instalar"});
    if (escrito === null) return;
    if (escrito !== id) { toast("No coincide: no se instaló nada."); return; }
    try { const r = await api("POST", "/api/plugins/install", {repo, id, confirm: id}); st.aviso = `Instalado ${r.id} (commit ${r.sha}). ${r.note}`; st.plugins = null; await cargar(); }
    catch (e) { mostrarError(e, null); }
    return;
  }
  if (ev.target.id !== "m-nuevo") return;
  ev.preventDefault();
  await moodAccion({action: "add", name: $("#m-nombre").value.trim(), description: $("#m-desc").value}, "Mood agregado.");
});
const TEMAS = ["auto", "claro", "oscuro"];
function aplicarTema(tema) {
  if (tema === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", tema);
  $("#tema").textContent = `Tema: ${tema}`;
  try { localStorage.setItem("orquesta-tema", tema); } catch { /* sin storage */ }
}
try { aplicarTema(localStorage.getItem("orquesta-tema") || "auto"); } catch { aplicarTema("auto"); }
$("#tema").addEventListener("click", () => {
  const actual = document.documentElement.getAttribute("data-theme") || "auto";
  aplicarTema(TEMAS[(TEMAS.indexOf(actual) + 1) % TEMAS.length]);
});
const ESTILOS = ["partitura", "archive", "deck", "workshop"];
function aplicarEstilo(estilo) {
  if (!ESTILOS.includes(estilo)) estilo = "partitura";
  if (estilo === "partitura") document.documentElement.removeAttribute("data-estilo"); else document.documentElement.setAttribute("data-estilo", estilo);
  $("#estilo").value = estilo;
  $("#tema").hidden = estilo !== "partitura";
  try { localStorage.setItem("orquesta-estilo", estilo); } catch { /* sin storage */ }
}
try { aplicarEstilo(localStorage.getItem("orquesta-estilo") || "partitura"); } catch { aplicarEstilo("partitura"); }
$("#estilo").addEventListener("change", (ev) => aplicarEstilo(ev.target.value));
function comandosPaleta() {
  const cmds = PESTANAS.map(([id, nombre]) => ({etiqueta: `Ir a ${nombre}`, accion: () => { st.tab = id; render(); }}));
  cmds.push({etiqueta: "Nueva conversación", accion: () => { st.tab = "chat"; st.chat.nueva = true; render(); }},
            {etiqueta: "Re-chequear salud (doctor)", accion: () => { st.tab = "salud"; render(); cargarSalud(true); }},
            {etiqueta: "Revisar cambios sin aplicar", accion: () => { st.tab = "aplicar"; render(); correrDryRun(); }},
            {etiqueta: "Cambiar tema", accion: () => $("#tema").click()});
  st.chat.convs.forEach((v) => cmds.push({etiqueta: `Abrir: ${v.title}`, accion: () => { st.tab = "chat"; render(); abrirConv(v.id); }}));
  return cmds;
}
let paletaSel = 0, paletaItems = [];
async function filtrarPaleta() {
  const q = $("#paleta-q").value.trim().toLowerCase();
  paletaItems = comandosPaleta().filter((c) => !q || c.etiqueta.toLowerCase().includes(q));
  if (q.length >= 3) {
    try {
      const r = await api("GET", `/api/chat/search?q=${encodeURIComponent(q)}`);
      r.results.forEach((x) => paletaItems.push({etiqueta: `«${x.title}», ${x.author}: …${x.snippet}…`, accion: async () => {
        st.tab = "chat"; const tpid = x.project_id || "sin-proyecto"; if (st.chat.pid !== tpid) { st.chat.pid = tpid; await cargarChat(); } render(); abrirConv(x.conversation_id); }}));
    } catch { /* sin búsqueda */ }
  }
  paletaSel = Math.min(paletaSel, Math.max(0, paletaItems.length - 1));
  $("#paleta-lista").innerHTML = paletaItems.slice(0, 40).map((c, i) => `<li><button type="button" data-paleta="${i}" aria-selected="${i === paletaSel}">${esc(c.etiqueta)}</button></li>`).join("") || '<li class="ayuda">Sin resultados.</li>';
}
function abrirPaleta() { $("#paleta-q").value = ""; paletaSel = 0; $("#paleta").showModal(); filtrarPaleta(); $("#paleta-q").focus(); }
function elegirPaleta(i) { const c = paletaItems[i]; $("#paleta").close(); if (c) c.accion(); }
$("#paleta-q").addEventListener("input", () => { paletaSel = 0; filtrarPaleta(); });
$("#paleta-q").addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown") { paletaSel = Math.min(paletaSel + 1, paletaItems.length - 1); ev.preventDefault(); filtrarPaleta(); }
  else if (ev.key === "ArrowUp") { paletaSel = Math.max(paletaSel - 1, 0); ev.preventDefault(); filtrarPaleta(); }
  else if (ev.key === "Enter") { ev.preventDefault(); elegirPaleta(paletaSel); }
});
$("#paleta-lista").addEventListener("click", (ev) => { const b = ev.target.closest("[data-paleta]"); if (b) elegirPaleta(+b.dataset.paleta); });
document.addEventListener("keydown", (ev) => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); abrirPaleta(); } });
$("#salud-chip").addEventListener("click", () => { st.tab = "salud"; render(); });
document.addEventListener("input", (ev) => {
  if (ev.target.id === "rrhh-texto") { actualizarTextoRRHH(ev.target.value); return; }
  if (ev.target.id !== "chat-texto" || !st.chat.conv) return;
  const m = ev.target.value.slice(0, ev.target.selectionStart).match(/@([a-z0-9-]*)$/);
  const opciones = m ? st.chat.conv.participants.filter((p) => p.startsWith(m[1])) : [];
  $("#menciones").innerHTML = opciones.length ? `<ul class="menciones">${opciones.map((p) => `<li><button type="button" class="${colorDe(p)}" data-action="mencion" data-name="${esc(p)}">@${esc(p)}</button></li>`).join("")}</ul>` : "";
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && st.tab === "chat" && st.chat.conv && st.chat.conv.busy && !$("#dlg").open) {
    api("POST", `/api/chat/conversations/${st.chat.conv.id}/cancel`).then(() => toast("Cortando el turno…"));
  }
  if (ev.target.id === "chat-texto" && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); $("#chat-enviar").requestSubmit(); }
});

cargar().then(() => { cargarSalud(false); cargarChat(); });
</script>
</body>
</html>
